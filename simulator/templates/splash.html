{% load static %}

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SolarIQ</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Splash CSS -->
    <link rel="stylesheet" href="{% static 'css/splash.css' %}">

</head>

<body>

    <!-- =========================
     SolarIQ Cinematic Splash
========================= -->

    <div id="splash-screen">

        <!-- Background -->

        <div class="sky-layer"></div>

        <div class="sun-glow"></div>

        <div class="energy-grid"></div>

        <!-- Light Beams -->

        <div class="light-beams">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Floating Particles -->

        <div class="floating-particles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Main Content -->

        <div class="splash-content">

            <!-- Logo -->

            <div class="logo-container">

                <!-- Rotating Orbits -->

                <div class="orbit orbit-1"></div>
                <div class="orbit orbit-2"></div>
                <div class="orbit orbit-3"></div>
                <div class="orbit orbit-4"></div>

                <!-- Glow -->

                <div class="logo-glow"></div>

                <!-- Solar Logo -->

                <div class="solar-logo">

                    <!-- Sun -->

                    <div class="sun-core"></div>

                    <div class="sun-rays">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                    <!-- Solar Panel -->

                    <div class="solar-panel">

                        <div class="panel-grid">

                            <span></span>
                            <span></span>
                            <span></span>

                            <span></span>
                            <span></span>
                            <span></span>

                            <span></span>
                            <span></span>
                            <span></span>

                        </div>

                        <div class="panel-shine"></div>

                    </div>

                    <!-- Energy Ring -->

                    <div class="energy-ring"></div>

                    <!-- Floating Energy Dots -->

                    <div class="energy-dot dot-1"></div>
                    <div class="energy-dot dot-2"></div>
                    <div class="energy-dot dot-3"></div>
                    <div class="energy-dot dot-4"></div>

                </div>

            </div>

            <!-- Title -->

            <h1 id="typing-title"></h1>

            <h3 class="subtitle">
                مستقبل الطاقة الشمسية يبدأ هنا
            </h3>

            <!-- Divider -->
            <div class="gold-divider">
                <div class="gold-fill"></div>
            </div>

            <!-- Loading -->

            <div class="loading-section">

                <span class="loading-text">
                    Initializing Smart Solar System
                </span>

                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Splash JS -->

    <script src="{% static 'js/splash.js' %}"></script>

</body>

</html>
